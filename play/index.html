<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0E1116">
<title>ALWAYS UP</title>
<style>
  :root{ --ink:#0E1116; --fg:#E8EEF4; --dim:#5C6B7A; --accent:#2DD4BF; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--ink); overflow:hidden;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  #game{ width:100%; height:100%; display:block; touch-action:none; outline:none; }

  .hud{ position:fixed; z-index:5; pointer-events:none; color:var(--fg);
    font-size:12px; letter-spacing:.06em; font-variant-numeric:tabular-nums; }
  #score{ top:10px; left:12px; font-size:20px; font-weight:650; letter-spacing:.02em; }
  #best{ top:14px; right:12px; color:var(--dim); font-weight:600; }

  #overlay{ position:fixed; inset:0; z-index:6; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:10px; pointer-events:none;
    background:rgba(14,17,22,.72); text-align:center; padding:20px; }
  #overlay.hidden{ display:none; }
  #ov-title{ color:#fff; font-size:30px; font-weight:750; letter-spacing:.10em; margin:0; }
  #ov-body{ color:var(--fg); font-size:13px; line-height:1.6; letter-spacing:.06em; margin:0; }
  #ov-body .k{ color:var(--dim); font-size:11px; }

  /* the only chrome: a slim way back to the game's page */
  #bar{ position:fixed; left:0; right:0; bottom:0; z-index:7; height:26px;
    display:flex; align-items:center; justify-content:center; gap:6px;
    background:#0B0E13; border-top:1px solid #171C23; }
  #bar a{ color:var(--dim); text-decoration:none; font-size:10.5px; letter-spacing:.14em;
    font-weight:700; pointer-events:auto; }
  #bar a:hover{ color:var(--accent); }
</style>
</head>
<body>
  <canvas id="game" aria-label="ALWAYS UP game canvas"></canvas>

  <div class="hud" id="score">0 m</div>
  <div class="hud" id="best">BEST 0 m</div>

  <div id="overlay">
    <h1 id="ov-title">ALWAYS UP</h1>
    <p id="ov-body">TAP LEFT / RIGHT TO CLIMB<br><span class="k">or use the arrow keys</span></p>
  </div>

  <div id="bar"><a href="../" target="_top">ALWAYS UP &#8599;</a></div>

  <script src="game.js"></script>
</body>
</html>
